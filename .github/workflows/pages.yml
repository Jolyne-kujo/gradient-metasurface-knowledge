name: Publish optics knowledge base

on:
  push:
    branches: [main]
    paths:
      - site-bundle.zip
      - publication_manifest.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Extract and verify the knowledge base
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib, json
          root = Path('_site')
          manifest = json.loads(Path('publication_manifest.json').read_text(encoding='utf-8'))
          with ZipFile('site-bundle.zip') as bundle:
              assert bundle.testzip() is None
              assert set(bundle.namelist()) == {row['path'] for row in manifest}
              assert all(not Path(p).is_absolute() and '..' not in Path(p).parts for p in bundle.namelist())
              bundle.extractall(root)
          for row in manifest:
              path = root / row['path']
              assert hashlib.sha256(path.read_bytes()).hexdigest() == row['sha256'], row['path']
          assert (root / 'index.html').is_file()
          print(f'Verified {len(manifest)} files for publication.')
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
